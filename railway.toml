[build]
builder = "RAILPACK"
buildCommand = "python -m pip install -r requirements.txt && pytest -q && python -m pip install -r launch-desk/requirements.txt && (cd launch-desk && pytest -q)"

[deploy]
startCommand = "python -m app.server"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
