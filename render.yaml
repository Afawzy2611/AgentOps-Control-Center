services:
  - type: web
    name: agentops-control-center
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.server
    envVars:
      - key: AGENT_RUNTIME
        value: deterministic
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: OPENAI_API_KEY
        sync: false
