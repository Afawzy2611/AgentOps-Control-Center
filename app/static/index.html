<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentOps Control Center</title>
<style>
body{margin:0;font:14px system-ui,sans-serif;background:#07101d;color:#edf4fb}
.wrap{max-width:1100px;margin:auto;padding:24px}button{margin:4px;padding:8px 12px;border-radius:8px;cursor:pointer}
.card{border:1px solid #22344b;border-radius:12px;padding:14px;margin:10px 0;background:#0d1929}
</style>
</head>
<body><main class="wrap">
<header><h1>AgentOps Control Center</h1>
<p>Multi-agent engineering control plane (safe demo)</p>
<button onclick="run()">Run analysis</button>
<button onclick="decision('APPROVE')">Approve</button>
<button onclick="exportRun()">Export JSON</button>
</header>
<section class="card"><div id="status">idle</div><pre id="out">No run yet.</pre></section>
</main>
<script>
let currentRunId=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'\x26amp;','<':'\x26lt;','>':'\x26gt;','"':'\x26quot;',"'":'\x26#39;'}[c]))}
function apiKey(){return localStorage.getItem('AGENTOPS_API_KEY')||window.AGENTOPS_API_KEY||'';}
function authHeaders(){const h={'Content-Type':'application/json'};const k=apiKey();if(k){h['Authorization']='Bearer '+k;h['X-API-Key']=k;}return h;}
async function run(){const r=await fetch('/api/run',{method:'POST',headers:authHeaders(),body:JSON.stringify({project:'AgentOps Final Demo v2'})});const x=await r.json();if(!r.ok){alert(x.error||('Run failed: '+r.status));return;}currentRunId=x.run_id||null;if(currentRunId)localStorage.setItem('AGENTOPS_RUN_ID',currentRunId);document.getElementById('status').textContent=esc(currentRunId||'ok');document.getElementById('out').textContent=JSON.stringify(x,null,2)}
async function decision(d){if(!currentRunId){alert('Run analysis first.');return;}const r=await fetch('/api/decision',{method:'POST',headers:authHeaders(),body:JSON.stringify({decision:d,run_id:currentRunId})});const x=await r.json();alert(x.message||x.error||r.status)}
async function exportRun(){if(!currentRunId){alert('Run analysis first.');return;}const r=await fetch('/api/export?run_id='+encodeURIComponent(currentRunId),{headers:authHeaders()});if(!r.ok){alert('Export failed');return;}const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='agentops-run-'+currentRunId+'.json';a.click();URL.revokeObjectURL(url)}
</script></body></html>
